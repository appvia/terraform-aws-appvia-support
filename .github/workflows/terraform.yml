---
name: Terraform
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  lza-module-validation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@b338cd91b41e8af3aa515365dc4a534e97094cb8 # main
    name: Landing Zone Module Validation
    with:
      working-directory: "modules/lza"

  cost-module-validation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@b338cd91b41e8af3aa515365dc4a534e97094cb8 # main
    name: Cost Analysis Module Validation
    with:
      working-directory: "modules/costanalysis"
