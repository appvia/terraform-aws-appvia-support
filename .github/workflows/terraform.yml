---
name: Terraform
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  lza-module-validation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@313f07f46b44c4f3c82e878d71dc3182a0ce3c3d # main
    name: Landing Zone Module Validation
    with:
      working-directory: "modules/lza"

  cost-module-validation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@313f07f46b44c4f3c82e878d71dc3182a0ce3c3d # main
    name: Cost Analysis Module Validation
    with:
      working-directory: "modules/costanalysis"
