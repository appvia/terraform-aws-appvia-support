---
name: Terraform
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  lza-module-validation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@b2042fe251447efbe801c4ad02e6433c5304d16c # main
    name: Landing Zone Module Validation
    with:
      working-directory: "modules/lza"

  cost-module-validation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@b2042fe251447efbe801c4ad02e6433c5304d16c # main
    name: Cost Analysis Module Validation
    with:
      working-directory: "modules/costanalysis"
