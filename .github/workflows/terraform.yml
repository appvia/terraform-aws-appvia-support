---
name: Terraform
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  lza-module-validation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@0ef7f561e899508b7425574ce3d9e9f57ced6154 # main
    name: Landing Zone Module Validation
    with:
      working-directory: "modules/lza"

  cost-module-validation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@0ef7f561e899508b7425574ce3d9e9f57ced6154 # main
    name: Cost Analysis Module Validation
    with:
      working-directory: "modules/costanalysis"
